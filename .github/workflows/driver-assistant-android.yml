name: Driver Assistant Android

on:
  push:
    paths:
      - "driver-assistant-android/**"
      - ".github/workflows/driver-assistant-android.yml"
  pull_request:
    paths:
      - "driver-assistant-android/**"
      - ".github/workflows/driver-assistant-android.yml"
  workflow_dispatch:

concurrency:
  group: driver-assistant-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: driver-assistant-android

jobs:
  build:
    name: Platform-core tests + Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Platform-core unit and scenario tests
        run: ./gradlew --no-daemon --stacktrace platformCoreTest
      - name: Assemble debug APK and compile Android tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :core:database:assembleDebugAndroidTest
      - name: Android lint (debug)
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-assistant-reports
          path: |
            driver-assistant-android/platform-core/**/build/reports/tests/
            driver-assistant-android/app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: driver-assistant-debug-apk
          path: driver-assistant-android/app/build/outputs/apk/debug/*.apk

  instrumented:
    name: Instrumented UI tests (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: driver-assistant-android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest :core:database:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-assistant-instrumented-reports
          path: |
            driver-assistant-android/app/build/reports/androidTests/
            driver-assistant-android/core/database/build/reports/androidTests/
          if-no-files-found: ignore
