org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------------------------
# Environment configuration (do NOT commit real values; prefer ~/.gradle/gradle.properties,
# -P flags, or the FTDA_* environment variables):
#   ftda.apiBaseUrl     / FTDA_API_BASE_URL     Freight Tiger assistant API base URL (https only)
#   ftda.apiEnvironment / FTDA_API_ENVIRONMENT  Label shown in settings, e.g. "staging"
#   ftda.demoMode       / FTDA_DEMO_MODE        true = use the in-app SIMULATED backend
#                                               (debug default: true, release default: false)
#   ftda.supportPhone   / FTDA_SUPPORT_PHONE    Verified support number. Empty = no call button.
